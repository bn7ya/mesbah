name: CI

# Only a merge into main runs CI. Before that, the local gate is the check
# (rule 25) — a pull request runs nothing here.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Guard hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The hooks enforce the mechanical rules during a session. Running them
      # here catches anything committed from an environment without them.
      - name: Check the hooks parse
        run: |
          python -m compileall -q .claude/hooks

      # The session hooks fabricate a HOME and a real short-lived process, so
      # this asserts liveness, the conflict warning and -- the one that keeps
      # the feature alive -- that a peer who merely goes on existing is silent.
      - name: Check the session hooks
        run: |
          python3 .claude/hooks/test_session_hooks.py

      - name: Check the Template sync
        run: |
          python3 .claude/hooks/test_template_sync.py

      - name: Run guard-checks over the tree
        run: |
          fail=0
          while IFS= read -r file; do
            printf '{"tool_input":{"file_path":"%s"}}' "$file" \
              | python3 .claude/hooks/guard-checks.py || fail=1
          done < <(git ls-files 'backend/**/*.py' 'frontend/src/**/*.ts' \
                                'frontend/src/**/*.html' 'frontend/src/**/*.scss' \
                                'frontend/src/**/*.json')
          exit $fail
        shell: bash

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "1"
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        # The dependency list only: the package itself is built by the `package` job.
        run: |
          pip install "uv>=0.9,<1"
          uv pip install --system -r pyproject.toml --extra dev

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Rule 30: every signature and variable typed, and the types true.
      - name: Type check
        run: mypy .

      # A model changed without a migration is a broken deploy, not a review note.
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python manage.py migrate --noinput

      # Rule: every endpoint documents itself. A spectacular warning means a
      # missing @extend_schema, not a noisy tool.
      - name: OpenAPI schema
        run: python manage.py spectacular --fail-on-warn --file /dev/null

      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing

  # The built-in engine, the trainer and the exporters on real (tiny) models, on the CPU. The
  # backend job runs without torch, so these are skipped there.
  ml:
    name: Engine, trainer and exports
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install "uv>=0.9,<1"
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r pyproject.toml --extra dev --extra train --extra gguf
      - name: Tests that need torch
        run: pytest -m ml mesbah

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      # Angular 22 requires >= 22.22.3 / >= 24.15.0.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Build
        run: npx ng build --configuration production

      # Vitest in jsdom — no browser to launch.
      - name: Tests
        run: npx ng test --watch=false

  # `pip install mesbah` is one of the two ways Mesbah runs (ADR-003). Build the wheel the way a
  # release does, install it where nothing else is, and check it starts and serves the app.
  package:
    name: pip package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The oldest Python the package supports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the frontend and the wheel
        run: |
          pip install "build>=1.3,<2"
          python backend/tools/build_wheel.py

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install backend/dist/*.whl
          "$RUNNER_TEMP/clean/bin/mesbah" doctor

      - name: Start it and ask for the app
        shell: bash
        run: |
          "$RUNNER_TEMP/clean/bin/mesbah" --data-dir "$RUNNER_TEMP/data" start --no-browser &
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:8077/api/health/ && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8077/api/auth/setup/ | grep '"needed":true'
          curl -fs http://127.0.0.1:8077/system | grep '<app-root>'
          kill -TERM %1
          wait

  i18n:
    name: Translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Rule 22: every key exists in both languages, and no Arabic value
      # carries tashkeel (22e). Mechanical, so it is a check rather than a
      # review comment.
      - name: en and ar have the same keys
        shell: python
        run: |
          import json, pathlib, re, sys

          # Rule 22e: a word that needs a vowel mark to be read is the wrong
          # word (.claude/docs/language.md).
          TASHKEEL = re.compile("[\u064b-\u0652\u0670]")

          def leaves(node, prefix=""):
              for key, value in node.items():
                  path = f"{prefix}.{key}" if prefix else key
                  if isinstance(value, dict):
                      yield from leaves(value, path)
                  else:
                      yield path, value

          def keys(node, prefix=""):
              out = set()
              for key, value in node.items():
                  path = f"{prefix}.{key}" if prefix else key
                  out |= keys(value, path) if isinstance(value, dict) else {path}
              return out

          failed = False
          for en_path in pathlib.Path("frontend/src").rglob("en.json"):
              ar_path = en_path.with_name("ar.json")
              if not ar_path.exists():
                  print(f"::error file={en_path}::no ar.json beside it")
                  failed = True
                  continue
              en = keys(json.loads(en_path.read_text(encoding="utf-8")))
              ar = keys(json.loads(ar_path.read_text(encoding="utf-8")))
              for key in sorted(en - ar):
                  print(f"::error file={ar_path}::missing key: {key}")
                  failed = True
              for key in sorted(ar - en):
                  print(f"::error file={en_path}::missing key: {key}")
                  failed = True
              for key, value in leaves(json.loads(ar_path.read_text(encoding="utf-8"))):
                  if isinstance(value, str) and TASHKEEL.search(value):
                      print(f"::error file={ar_path}::{key} carries tashkeel - rule 22e, replace the word")
                      failed = True

          sys.exit(1 if failed else 0)

  memory:
    name: Feature memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rule 3: a CLAUDE.md per feature, on both sides.
      - name: Every feature has a CLAUDE.md
        shell: bash
        run: |
          fail=0
          for dir in frontend/src/app/features/*/ backend/apps/*/; do
            [ -d "$dir" ] || continue
            case "$(basename "$dir")" in __pycache__|.*) continue ;; esac
            [ -f "$dir/CLAUDE.md" ] || { echo "::error::$dir has no CLAUDE.md"; fail=1; }
          done
          exit $fail
