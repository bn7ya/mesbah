name: Release

# A tag `vX.Y.Z` publishes that commit to PyPI as `mesbah`, with the Angular app inside the wheel.
# PyPI trusts this workflow directly (trusted publishing): the `pypi` environment must be set
# up once on pypi.org for this repository; no token is stored here.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build and check the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag matches the package version
        shell: bash
        run: |
          version=$(sed -n 's/^__version__: str = "\(.*\)"$/\1/p' backend/mesbah/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, package $version"; exit 1; }

      - name: Build the frontend, the wheel and the source archive
        run: |
          pip install "build>=1.3,<2"
          python backend/tools/build_wheel.py

      - name: Install the wheel where nothing else is, and start it
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install backend/dist/*.whl
          "$RUNNER_TEMP/clean/bin/mesbah" doctor
          "$RUNNER_TEMP/clean/bin/mesbah" --data-dir "$RUNNER_TEMP/data" start --no-browser &
          mesbah=$!
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:8077/api/health/ && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8077/projects | grep '<app-root>'
          kill -TERM "$mesbah"
          wait "$mesbah"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
