# Production overlay. Angular is built statically and served by nginx, which
# also reverse-proxies /api, /admin and /static to uvicorn (ASGI, so replies can stream).
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Everything is on http://localhost:${NGINX_PORT} — one origin, no CORS.

services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    build:
      target: prod
    command:
      - uvicorn
      - config.asgi:application
      - --host=0.0.0.0
      - --port=8000
      - --workers=${WEB_WORKERS:-3}
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
    ports: !reset []
    develop: !reset null

  worker:
    build:
      target: prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
    develop: !reset null

  worker-heavy:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"

  beat:
    build:
      target: prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
    develop: !reset null

  # Set DBS_SSH_HOST before this counts as a backup: each one is then pushed
  # offsite in the same cycle. One that only exists on the machine it backs up
  # is not a backup.
  backup:
    build:
      target: prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
    develop: !reset null

  # In production the frontend is a build step, not a running server: it emits
  # the static bundle into a volume that nginx serves.
  frontend:
    build:
      target: prod
    command: ["sh", "-c", "rm -rf /dist/* && cp -r /app/dist/frontend/browser/. /dist/"]
    volumes:
      - frontend-dist:/dist
    ports: !reset []
    depends_on: !reset []
    develop: !reset null
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
      - static-files:/var/www/static:ro
      - media-files:/var/www/media:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  frontend-dist:
