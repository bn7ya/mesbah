# Production front door. One origin for everything, so no CORS anywhere.
#
#   /            → the built Angular bundle (SPA fallback to index.html)
#   /api/        → uvicorn (replies stream; keepalives every ten seconds)
#   /v1/         → uvicorn, Mesbah's OpenAI-compatible API
#   /ollama/     → uvicorn, Mesbah's Ollama-compatible API
#   /admin/      → uvicorn
#   /static/     → collectstatic output
#   /media/      → uploads

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Angular writes hashed filenames, so the bundle is safe to cache hard;
    # index.html is not, or a deploy would never reach anyone.
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Exports are as large as models; stream them instead of spooling to disk.
        proxy_max_temp_file_size 0;
    }

    # A dataset file may be up to 200 MB; the API refuses anything larger with file_too_large.
    location = /api/datasets/upload/ {
        client_max_body_size 201m;
        proxy_request_buffering off;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # API clients wait for a whole reply, or a model to load, before the first byte.
    location ~ ^/(v1|ollama)/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
