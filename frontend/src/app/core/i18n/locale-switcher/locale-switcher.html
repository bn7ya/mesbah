<mat-button-toggle-group [attr.aria-label]="label()" [value]="current()" (change)="select($event.value)">
  @for (option of options(); track option.value) {
    <mat-button-toggle [value]="option.value" [attr.lang]="option.value">
      {{ option.label }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
