@if (error(); as failure) {
  <app-note kind="error">{{ failure.message }}</app-note>
  <div>
    <button matButton type="button" (click)="tryAgain()">{{ 'actions.retry' | t }}</button>
  </div>
}

@if (loading() && page().results.length === 0) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'training.examples.loading' | t" />
}

@if (empty()) {
  <app-empty-state icon="fa-comments" [heading]="'training.examples.empty.title' | t">
    {{ 'training.examples.empty.body' | t }}
    <a emptyActions matButton [routerLink]="['/projects', projectId(), 'chat']">
      <mat-icon fontIcon="fa-message" />
      {{ 'training.examples.empty.toChat' | t }}
    </a>
  </app-empty-state>
}

<ul class="examples__list" [attr.aria-label]="'training.examples.list' | t" [attr.aria-busy]="loading()">
  @for (example of page().results; track example.id) {
    <li>
      <app-example-card [example]="example" />
    </li>
  }
</ul>

@if (paged()) {
  <mat-paginator
    [length]="page().count"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="sizes"
    [attr.aria-label]="'training.examples.pages' | t"
    (page)="turnPage($event)"
  />
}
