<h2 mat-dialog-title>{{ 'versions.rename.title' | t }}</h2>

<form novalidate (ngSubmit)="submit()">
  <mat-dialog-content class="rename">
    @if (failure(); as problem) {
      <app-note kind="error">{{ problem.message }}</app-note>
    }

    <mat-form-field>
      <mat-label>{{ 'versions.rename.name' | t }}</mat-label>
      <input
        matInput
        name="name"
        dir="auto"
        autocomplete="off"
        [maxlength]="nameMax"
        [errorStateMatcher]="nameErrors"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      />
      <mat-error>{{ 'versions.rename.nameRequired' | t }}</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>{{ 'versions.rename.notes' | t }}</mat-label>
      <textarea
        matInput
        name="notes"
        dir="auto"
        cdkTextareaAutosize
        cdkAutosizeMinRows="3"
        cdkAutosizeMaxRows="8"
        [maxlength]="notesMax"
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
      ></textarea>
      <mat-hint>{{ 'versions.rename.notesHint' | t }}</mat-hint>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" [mat-dialog-close]="false">{{ 'actions.cancel' | t }}</button>
    <button matButton="filled" type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
      {{ (busy() ? 'versions.rename.working' : 'actions.save') | t }}
    </button>
  </mat-dialog-actions>
</form>
