<figure class="code">
  <figcaption class="code__bar">
    @if (label(); as caption) {
      <span class="code__label">{{ caption }}</span>
    }
    <ng-content />
  </figcaption>
  <pre
    #body
    class="code__body"
    dir="ltr"
    [attr.role]="scrolls() ? 'region' : null"
    [attr.tabindex]="scrolls() ? 0 : null"
    [attr.aria-label]="scrolls() ? name() : null"
  ><code>{{ code() }}</code></pre>
</figure>
